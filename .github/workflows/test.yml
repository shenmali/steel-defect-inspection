name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 numpy==2.3.3 opencv-python==4.10.0.84 segmentation-models-pytorch==0.3.4 fastapi==0.141.1 uvicorn==0.52.1 python-multipart==0.0.20 onnx==1.17.0 pytest==9.1.1
      - run: python -m pip install -e .
      - run: python -m pytest -q
